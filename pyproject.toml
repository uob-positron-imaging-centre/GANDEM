[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gandem"
version = "0.1.0"
description = "GAN-DEM - AI-based DEM simulation interface from particulate 2D imaging"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Abhirup Roy", email = "axr154@bham.ac.uk"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "cma>=4.4.4",
    "numpy>=1.21.0",
    "scikit-image>=0.18.0",
    "torch>=2.10.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.3.0",
    "trimesh>=3.9.0",
    "fast-simplification>=0.1.13",
    "numpy-stl>=2.16.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "opencv-python-headless>=5.0",
    "pymeshfix>=0.18.1",
    "pyvista>=0.48.4",
]

[project.scripts]
gandem-train = "gandem.ganular.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=22.0", "flake8>=4.0"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://github.com/abhirup-roy/GAN-DEM"
Repository = "https://github.com/abhirup-roy/GAN-DEM"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gandem*"]
