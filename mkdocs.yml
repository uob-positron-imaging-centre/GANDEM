site_name: GAN-DEM
site_description: AI-based workflow for reconstruction of 2D projections to 3D particles for DEM simulation.
site_author: Abhirup Roy
repo_url: https://github.com/uob-positron-imaging-centre/GANDEM
repo_name: uob-positron-imaging-centre/GANDEM

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uob-positron-imaging-centre/GANDEM

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorial:
      - End-to-end workflow: tutorials/end-to-end.md
  - Guides:
      - Train GANular: guides/training.md
      - Generate and process meshes: guides/generate-and-process.md
      - Select a particle population: guides/select-population.md
  - API Reference:
      - Command line: reference/cli.md
      - Pre-processing: reference/pre.md
      - GANular: reference/ganular.md
      - EvoPop: reference/evopop.md
      - Supporting utilities: reference/utilities.md
